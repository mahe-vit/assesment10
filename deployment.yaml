apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-maintenance-deployment
  labels:
    app: predictive-maintenance
spec:
  replicas: 3
  selector:
    matchLabels:
      app: predictive-maintenance
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: predictive-maintenance
    spec:
      containers:
      - name: maintenance-dashboard
        image: yourdockerhubusername/predictive-maintenance-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-maintenance-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: predictive-maintenance
